name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test repository checks
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Validate links and release artifacts
        run: python3 tools/check_repository.py
      - name: Check website JavaScript syntax
        run: node --check docs/app.js
